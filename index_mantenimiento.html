<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Pronóstico Agroclimático - Rivera</title>
<style>
  :root{ --verde:#2e6b3e; --tinta:#1f2d24; --papel:#f4f1e8; --gris:#6b6b6b; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--papel); color: var(--tinta);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px; text-align:center;
  }
  .caja{ max-width:520px; width:100%; }
  .icono{ width:120px; height:120px; margin:0 auto 28px; display:block; }
  h1{ font-size:1.45rem; color:var(--verde); margin-bottom:14px; line-height:1.3; }
  p.msg{ font-size:1.1rem; margin-bottom:8px; }
  p.sub{ color:var(--gris); font-size:.95rem; margin-top:18px; }
  /* animación suave del brazo del trabajador */
  .brazo{ transform-origin:62px 74px; animation: pica 1.6s ease-in-out infinite; }
  @keyframes pica{
    0%,100%{ transform: rotate(0deg); }
    45%{ transform: rotate(-38deg); }
  }
  @media (prefers-color-scheme: dark){
    :root{ --papel:#1b1f1c; --tinta:#e8e6dd; --verde:#7fc98f; --gris:#a3a3a3; }
  }
</style>
</head>
<body>
  <div class="caja">
    <!-- Icono: persona trabajando (SVG propio, sin dependencias externas) -->
    <svg class="icono" viewBox="0 0 140 140" role="img" aria-label="Persona trabajando">
      <circle cx="70" cy="70" r="66" fill="none" stroke="currentColor" stroke-opacity=".12" stroke-width="4"/>
      <!-- suelo -->
      <line x1="30" y1="112" x2="110" y2="112" stroke="currentColor" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
      <!-- casco -->
      <path d="M52 44 a18 12 0 0 1 36 0 z" fill="#e0a423"/>
      <rect x="49" y="43" width="42" height="5" rx="2.5" fill="#e0a423"/>
      <!-- cabeza -->
      <circle cx="70" cy="52" r="9" fill="currentColor"/>
      <!-- cuerpo -->
      <path d="M62 61 h16 l4 34 h-24 z" fill="#2e6b3e"/>
      <!-- piernas -->
      <line x1="64" y1="95" x2="61" y2="112" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <line x1="76" y1="95" x2="79" y2="112" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <!-- brazo + pala/pico que se mueve -->
      <g class="brazo">
        <line x1="62" y1="72" x2="92" y2="66" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
        <line x1="92" y1="66" x2="104" y2="96" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
        <path d="M100 92 l14 4 -4 10 z" fill="#9aa0a6"/>
      </g>
    </svg>

    <h1>Sistema de Pronóstico Agroclimático — Rivera</h1>
    <p class="msg">En mejoras, vuelve en breve.</p>
    <p class="sub">Estamos trabajando para mejorar el sistema.<br>
       El servicio no estará disponible por unas horas.</p>
    <p class="sub">División de Desarrollo Rural — Intendencia de Rivera</p>
  </div>
</body>
</html>
